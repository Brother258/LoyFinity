<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join a Loyfinity team</title><link rel="stylesheet" href="/site.css"></head><body><main class="panel"><div class="mark">∞</div><h1>Join a business team</h1><p>Install Loyfinity, create an account with the email address this invitation was sent to, verify that email and sign in. Then open Profile → Join a business team and paste the invitation code below.</p><input id="token" class="field" readonly><button id="copy">Copy invitation code</button><div id="status" class="status" hidden></div></main><script>const token=new URLSearchParams(location.search).get('token')||'';const field=document.getElementById('token');field.value=token;document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(token);const s=document.getElementById('status');s.hidden=false;s.textContent='Invitation code copied.';}catch(e){field.select();document.execCommand('copy');}});</script></body></html>
